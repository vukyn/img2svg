# pnpm >= 11 reads settings only from this file; the "pnpm" field in package.json is ignored.

allowBuilds:
  esbuild: true

# Security pins for vulnerable transitive versions.
overrides:
  'brace-expansion@<1.1.21': '^1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '^2.1.7'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>img2svg — raster → vector tracer</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a222c; --panel2: #232f3d; --line: #2f3d4d;
    --fg: #e6edf3; --muted: #8b9bb0; --accent: #4fb8a3; --accent2: #6cbd9c;
    --err: #d9534f; --ok: #5cb85c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); padding: 32px 16px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center;
    cursor: pointer; transition: .15s; color: var(--muted);
  }
  #drop.hot { border-color: var(--accent); background: var(--panel2); color: var(--fg); }
  #drop img { max-width: 140px; max-height: 140px; border-radius: 8px; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  select, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 9px 14px;
    background: var(--panel2); color: var(--fg);
  }
  button.go { background: var(--accent); color: #08120f; border: none; font-weight: 600; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { cursor: pointer; }
  #log {
    background: #0b0f14; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; height: 150px; overflow-y: auto;
    color: var(--muted); white-space: pre-wrap;
  }
  #log .ok { color: var(--ok); } #log .err { color: var(--err); } #log .info { color: var(--accent2); }
  #out { min-height: 150px; display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 8px; overflow: hidden; }
  #out svg, #out img { max-width: 100%; max-height: 320px; }
  #out.empty { background: var(--panel2); color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 10px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="wrap">
  <h1>img2<span>svg</span></h1>
  <p class="sub">Trace a raster image (Pokémon art, icons, logos) into scalable vector SVG. Go service · python + vtracer engine.</p>

  <div class="grid">
    <!-- INPUT -->
    <div class="panel">
      <h2>1 · Upload image</h2>
      <div id="drop">
        <div id="dropText">Drop image here, or click to pick<br><small>png · jpg · gif · bmp · webp</small></div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="row">
        <label for="quality" style="color:var(--muted)">Quality</label>
        <select id="quality">
          <option value="faithful">faithful — exact, big</option>
          <option value="balanced">balanced</option>
          <option value="small">small — icons</option>
        </select>
        <button class="go" id="run" disabled>Trace → SVG</button>
      </div>
    </div>

    <!-- LOG -->
    <div class="panel">
      <h2>2 · Log</h2>
      <div id="log"></div>
    </div>
  </div>

  <!-- OUTPUT -->
  <div class="panel" style="margin-top:16px">
    <h2>3 · Output</h2>
    <div id="out" class="empty">SVG output shows here</div>
    <div class="meta">
      <span id="outName">no output yet</span>
      <button class="ghost" id="download" hidden>Download .svg</button>
    </div>
  </div>
</div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const runBtn = document.getElementById('run');
  const logEl = document.getElementById('log');
  const outEl = document.getElementById('out');
  const outName = document.getElementById('outName');
  const dlBtn = document.getElementById('download');
  const dropText = document.getElementById('dropText');
  let picked = null, pickedMeta = null, svgBlobUrl = null;

  function log(msg, cls='') {
    const t = new Date().toLocaleTimeString();
    logEl.innerHTML += `<span class="${cls}">[${t}] ${msg}</span>\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  const human = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(2) + ' MB';

  function setFile(f) {
    if (!f) return;
    picked = f; pickedMeta = null;
    runBtn.disabled = false;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      pickedMeta = { w: img.naturalWidth, h: img.naturalHeight };
      dropText.innerHTML = `<img src="${url}" alt="preview"><br>${f.name} · ${img.naturalWidth}×${img.naturalHeight} · ${human(f.size)}`;
      log(`selected ${f.name} — ${f.type || '?'} · ${img.naturalWidth}×${img.naturalHeight}px · ${human(f.size)}`, 'info');
    };
    img.onerror = () => {
      dropText.innerHTML = `<img src="${url}" alt="preview"><br>${f.name} · ${human(f.size)}`;
      log(`selected ${f.name} · ${human(f.size)}`, 'info');
    };
    img.src = url;
  }

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => setFile(e.target.files[0]));
  ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
  drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

  runBtn.addEventListener('click', async () => {
    if (!picked) return;
    const quality = document.getElementById('quality').value;
    runBtn.disabled = true;
    log(`tracing ${picked.name} @ ${quality} …`, 'info');
    const t0 = performance.now();

    const fd = new FormData();
    fd.append('image', picked);
    fd.append('quality', quality);

    try {
      const res = await fetch('/api/trace', { method: 'POST', body: fd });
      if (!res.ok) {
        const msg = await res.text();
        log(`error: ${msg.trim()}`, 'err');
        return;
      }
      const svg = await res.text();
      const ms = (performance.now() - t0).toFixed(0);
      const inBytes = picked.size;
      const outBytes = new Blob([svg]).size;

      // derive extra metrics from the SVG text
      const viewBox = (svg.match(/viewBox="([^"]+)"/) || [])[1];
      const paths = (svg.match(/<path\b/g) || []).length;
      const ratio = inBytes / outBytes; // >1 = output smaller than input

      outEl.classList.remove('empty');
      outEl.innerHTML = svg;
      const name = picked.name.replace(/\.[^.]+$/, '') + '.svg';
      outName.textContent = `${name} · ${human(outBytes)} · ${ms} ms`;

      if (svgBlobUrl) URL.revokeObjectURL(svgBlobUrl);
      svgBlobUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      dlBtn.hidden = false;
      dlBtn.onclick = () => { const a = document.createElement('a'); a.href = svgBlobUrl; a.download = name; a.click(); };

      log(`done → ${name}`, 'ok');
      log(`  input:  ${pickedMeta ? pickedMeta.w + '×' + pickedMeta.h + 'px · ' : ''}${human(inBytes)} (${picked.type || '?'})`);
      log(`  output: ${human(outBytes)} · ${paths} paths${viewBox ? ' · viewBox ' + viewBox : ''}`);
      const sizeNote = ratio >= 1 ? ratio.toFixed(1) + '× smaller' : (1 / ratio).toFixed(1) + '× larger';
      log(`  size:   ${sizeNote} than source · ${ms} ms · quality=${quality}`, ratio >= 1 ? 'ok' : 'info');
    } catch (err) {
      log(`request failed: ${err.message}`, 'err');
    } finally {
      runBtn.disabled = false;
    }
  });

  log('ready. drop an image to start.', 'info');
</script>
</body>
</html>
